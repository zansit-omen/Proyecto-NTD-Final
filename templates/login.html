<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | tutrabajo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Css/styles.css') }}">
</head>
<body style="background-color: var(--bg-light);">

    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="4" fill="#0077b5"/>
                        <path d="M7 9H10V18H7V9Z" fill="white"/>
                        <circle cx="8.5" cy="6.5" r="2" fill="white"/>
                        <path d="M12 9H15V11.5C15.5 10 16.5 9 18 9C20 9 21 10.5 21 13V18H18V13.5C18 12.5 17.5 11.5 16.5 11.5C15.5 11.5 15 12.5 15 13.5V18H12V9Z" fill="white"/>
                    </svg>
                    <span class="brand-name">tutrabajo</span>
                </a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>
            <p>Mantente al día de tu mundo profesional.</p>
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type = "submit" class = "btn-primary"> Iniciar sesión</button>
            </form>

            <div class="auth-footer">
                ¿Eres nuevo en tutrabajo? <a href="usuario/crear">Únete ahora</a>
            </div>
        </div>
    </div>

</body>
</html>
