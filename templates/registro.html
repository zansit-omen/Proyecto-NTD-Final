<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | tutrabajo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Css/styles.css') }}">
</head>
<body style="background-color: var(--bg-light);">

    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="4" fill="#0077b5"/>
                        <path d="M7 9H10V18H7V9Z" fill="white"/>
                        <circle cx="8.5" cy="6.5" r="2" fill="white"/>
                        <path d="M12 9H15V11.5C15.5 10 16.5 9 18 9C20 9 21 10.5 21 13V18H18V13.5C18 12.5 17.5 11.5 16.5 11.5C15.5 11.5 15 12.5 15 13.5V18H12V9Z" fill="white"/>
                    </svg>
                    <span class="brand-name">tutrabajo</span>
                </a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Registrarse</h2>
            <p>Saca el máximo partido a tu vida profesional.</p>
            
            <form action="/usuario/crear" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="form-group">
                    <label for="numero">Número de teléfono</label>
                    <input type="tel" id="numero" name="numero" required>
                </div>
                <div class="form-group">
                    <label for="tipoUsuario">Tipo de perfil</label>
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="candidato">Candidato (Busco empleo)</option>
                        <option value="delegado">Empresa (Publico ofertas)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña (6 o más caracteres)</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <button type="submit" class="btn-primary-auth">Aceptar y unirse</button>
            </form>

            <div class="auth-footer">
                ¿Ya estás en tutrabajo? <a href="/login">Inicia sesión</a>
            </div>
        </div>
    </div>

</body>
</html>
